<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Creá tu cuenta · Labor.io</title>

    <link rel="icon" href="../assets/img/brand-mark.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Bootstrap Icons por CDN con versión fija (node_modules no se publica) -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="../css/main.css" />
  </head>
  <body>
    <header class="top-bar container">
      <a href="../index.html" class="back-link">
        <i class="bi bi-chevron-left" aria-hidden="true"></i>
        Volver
      </a>
    </header>

    <main class="auth-page container py-4">
      <div class="row justify-content-center">
        <div class="col-md-8 col-lg-5 d-flex flex-column gap-4">
          <h1 class="page-title">Creá tu cuenta</h1>

          <!-- Dos columnas iguales; g-4 = 24 px de separación entre ellas -->
          <div class="social-login row g-4">
            <div class="col">
              <button type="button" class="btn btn-social w-100" aria-label="Continuar con Google">
                Google
              </button>
            </div>
            <div class="col">
              <button
                type="button"
                class="btn btn-social w-100"
                aria-label="Continuar con LinkedIn"
              >
                LinkedIn
              </button>
            </div>
          </div>

          <p class="divider-text">o con tu mail</p>

          <form class="auth-form d-flex flex-column gap-4" action="offers.html" method="get">
            <div>
              <label for="register-name" class="form-label">Nombre y apellido</label>
              <input
                type="text"
                id="register-name"
                class="form-control"
                placeholder="Ej: Bautista Guerra"
                autocomplete="name"
                required
              />
            </div>

            <div>
              <label for="register-email" class="form-label">Email</label>
              <input
                type="email"
                id="register-email"
                class="form-control"
                placeholder="tu@email.com"
                autocomplete="email"
                required
              />
            </div>

            <div>
              <label for="register-password" class="form-label">Contraseña</label>
              <div class="password-field">
                <input
                  type="password"
                  id="register-password"
                  class="form-control"
                  placeholder="Mínimo 8 caracteres"
                  autocomplete="new-password"
                  minlength="8"
                  pattern=".*[0-9].*"
                  required
                  aria-describedby="password-requirements"
                />
                <button
                  type="button"
                  class="password-toggle"
                  aria-label="Mostrar contraseña"
                  aria-pressed="false"
                >
                  <i class="bi bi-eye" aria-hidden="true"></i>
                </button>
              </div>
            </div>

            <ul class="password-requirements list-unstyled" id="password-requirements">
              <li><i class="bi bi-circle" aria-hidden="true"></i>al menos 8 caracteres</li>
              <li><i class="bi bi-circle" aria-hidden="true"></i>al menos 1 número</li>
            </ul>

            <div class="form-check">
              <input type="checkbox" id="register-terms" class="form-check-input" required />
              <label for="register-terms" class="form-check-label">
                Acepto los <a href="#">Términos y condiciones</a> y la
                <a href="#">Política de privacidad</a>.
              </label>
            </div>

            <button type="submit" class="btn btn-primary btn-lg-cta w-100">Registrarse</button>
          </form>
        </div>
      </div>
    </main>
  </body>
</html>
