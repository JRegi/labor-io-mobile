<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Iniciar sesión · Labor.io</title>

    <link rel="icon" href="../assets/img/brand-mark.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Bootstrap Icons por CDN con versión fija (node_modules no se publica) -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css"
    />
    <!-- Nuestro CSS compilado (Bootstrap + estilos propios). Ruta relativa: subimos un nivel desde pages/ -->
    <link rel="stylesheet" href="../css/main.css" />
  </head>
  <body>
    <header class="top-bar container">
      <a href="../index.html" class="back-link">
        <i class="bi bi-chevron-left" aria-hidden="true"></i>
        Volver
      </a>
    </header>

    <main class="auth-page container py-4">
      <div class="row justify-content-center">
        <div class="col-md-8 col-lg-5 d-flex flex-column gap-4">
          <h1 class="page-title">Bienvenido de nuevo</h1>

          <!-- Mismo bloque social-login que en register.html -->
          <div class="social-login row g-4">
            <div class="col">
              <button type="button" class="btn btn-social w-100" aria-label="Continuar con Google">
                Google
              </button>
            </div>
            <div class="col">
              <button
                type="button"
                class="btn btn-social w-100"
                aria-label="Continuar con LinkedIn"
              >
                LinkedIn
              </button>
            </div>
          </div>

          <p class="divider-text">o con tu mail</p>

          <form class="auth-form d-flex flex-column gap-4" action="offers.html" method="get">
            <div>
              <label for="login-email" class="form-label">Email</label>
              <input
                type="email"
                id="login-email"
                class="form-control"
                placeholder="tu@email.com"
                autocomplete="email"
                required
              />
            </div>

            <div>
              <label for="login-password" class="form-label">Contraseña</label>
              <div class="password-field">
                <input
                  type="password"
                  id="login-password"
                  class="form-control"
                  placeholder="Tu contraseña"
                  autocomplete="current-password"
                  required
                />
                <button
                  type="button"
                  class="password-toggle"
                  aria-label="Mostrar contraseña"
                  aria-pressed="false"
                >
                  <i class="bi bi-eye" aria-hidden="true"></i>
                </button>
              </div>
            </div>

            <a href="#" class="link-brand align-self-end">¿Olvidaste tu contraseña?</a>

            <button type="submit" class="btn btn-primary btn-lg-cta w-100 login-submit">
              Iniciar sesión
            </button>
          </form>
        </div>
      </div>
    </main>
  </body>
</html>
